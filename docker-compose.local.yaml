version: '3.8'

services:
  example-app:
    image: golang:1.26.2-alpine
    ports:
      - target: 8080
        published: 8085
        protocol: tcp
        mode: host
    volumes:
      - ./:/app
    working_dir: /app
    command: go run ./examples/go-app/main.go
    environment:
      - MY_SECRET=/var/run/secrets/testik
    secrets:
      - source: test
        target: /var/run/secrets/testik

  cloud-secrets:
    image: golang:1.26.2-alpine
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    working_dir: /app
    command: go run ./cmd/cloud-secrets/main.go
    env_file:
      - .env
    environment:
#      - CLOUDRU_PROJECT_ID=<cloudru-project-id>
      - CLOUDRU_IAM_CLIENT_ID=/var/run/secrets/iam_id
      - CLOUDRU_IAM_CLIENT_SECRET=/var/run/secrets/iam_secret
      - CLOUDRU_ROOT_FOLDER=/
#      - CLOUDRU_ROOT_FOLDER_OMIT_PREFIX=true
      - CS_LOG_LEVEL=debug
      - CS_REFRESH_INTERVAL=12s
      - CS_CLEANUP_ORPHANED=true
      - CS_SECRET_NAME_FOLDER_DELIMITER=-
    secrets:
      - iam_id
      - iam_secret
    deploy:
      labels:
        - prometheus.port=8000
      placement:
        constraints:
          - node.role == manager

secrets:
  # Секреты для тестового приложения
  test:
    external: true
  # Креды для IAM
  iam_id:
    file: iam_id
  iam_secret:
    file: iam_secret
