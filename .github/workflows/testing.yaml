name: testing

on:
  push:
    branches: ['master']
  pull_request:

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  code-lint:
    name: code-lint
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: Set up Go
        uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4; action page: <https://github.com/actions/setup-go>
        with:
          go-version: 1.26.2

      - name: Install Go dependencies
        run: go mod download

      - name: Run linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.10.1
          only-new-issues: false # show only new issues if it's a pull request
          args: -v --timeout=10m

  unit-test:
    name: unit-test
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: Set up Go
        uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4; action page: <https://github.com/actions/setup-go>
        with:
          go-version: 1.26.2

      - name: Install Go dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...
