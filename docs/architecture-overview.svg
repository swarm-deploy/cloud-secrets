<svg xmlns="http://www.w3.org/2000/svg" width="760" height="120" viewBox="0 0 760 120" role="img" aria-labelledby="title desc">
  <title id="title">cloud-secrets synchronization flow</title>
  <desc id="desc">External Secret Manager flows through cloud-secrets into Docker Secrets and then Swarm Services.</desc>

  <style>
    .node {
      fill: #f6f8fa;
      stroke: #8c959f;
      stroke-width: 1.5;
    }

    .node-primary {
      fill: #dafbe1;
      stroke: #1a7f37;
      stroke-width: 1.5;
    }

    .label {
      fill: #24292f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .arrow {
      fill: none;
      stroke: #57606a;
      stroke-width: 1.5;
      marker-end: url(#arrowhead);
    }

    .arrowhead {
      fill: #57606a;
    }

    @media (prefers-color-scheme: dark) {
      .node {
        fill: #161b22;
        stroke: #6e7681;
      }

      .node-primary {
        fill: #12261a;
        stroke: #3fb950;
      }

      .label {
        fill: #f0f6fc;
      }

      .arrow {
        stroke: #8b949e;
      }

      .arrowhead {
        fill: #8b949e;
      }
    }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path class="arrowhead" d="M0,0 L8,4 L0,8 Z"/>
    </marker>
  </defs>

  <rect class="node" x="10" y="35" width="180" height="50" rx="8"/>
  <text class="label" x="100" y="60">External Secret Manager</text>

  <path class="arrow" d="M190 60 H220"/>

  <rect class="node-primary" x="230" y="35" width="140" height="50" rx="8"/>
  <text class="label" x="300" y="60">cloud-secrets</text>

  <path class="arrow" d="M370 60 H400"/>

  <rect class="node" x="410" y="35" width="140" height="50" rx="8"/>
  <text class="label" x="480" y="60">Docker Secrets</text>

  <path class="arrow" d="M550 60 H580"/>

  <rect class="node" x="590" y="35" width="160" height="50" rx="8"/>
  <text class="label" x="670" y="60">Swarm Services</text>
</svg>
